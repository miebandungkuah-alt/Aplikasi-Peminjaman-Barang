<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEMINJAMAN BARANG - SMK IBU KARTINI SEMARANG</title>
    <!-- Favicon (Ikon Tab Chrome - Box Yellow Icon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23222521'/><g fill='%23ffca28'><path d='M26 12h12v12H26z' opacity='0.9'/><path d='M24 16h16v14H24z'/><path d='M28 16h8v8h-8z' fill='%23222521'/><path d='M10 32h16v14H10z' opacity='0.9'/><path d='M8 36h20v16H8z'/><path d='M13 36h10v9H13z' fill='%23222521'/><path d='M38 32h16v14H38z' opacity='0.9'/><path d='M36 36h20v16H36z'/><path d='M41 36h10v9H41z' fill='%23222521'/></g></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0f2042',
                            900: '#0b162c',
                            950: '#070e1e',
                        },
                        brand: {
                            blue: '#1e54e4',
                            yellow: '#ffcc00',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f3f5f9;
        }
        .custom-shadow {
            box-shadow: 0 10px 30px -5px rgba(15, 32, 66, 0.05);
        }
        .form-shadow {
            box-shadow: 0 15px 35px -5px rgba(15, 32, 66, 0.08);
        }
        .left-accent-line {
            border-left: 5px solid #1e54e4;
        }
        .left-orange-accent {
            border-left: 4px solid #f59e0b;
        }
        .left-green-accent {
            border-left: 4px solid #10b981;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-12 flex flex-col">

    <!-- Header Navigation Bar UI -->
    <header class="bg-navy-900 text-white shadow-md sticky top-0 z-50 py-3.5 px-4 sm:px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <!-- Branding Logo & School Name -->
            <div class="flex items-center space-x-3.5">
                <div class="bg-amber-400/20 text-amber-400 p-2.5 rounded-xl border border-amber-400/30 flex items-center justify-center">
                    <i class="fa-solid fa-boxes-stacked text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-wider uppercase font-sans leading-none">PEMINJAMAN BARANG</h1>
                    <p class="text-xs font-semibold text-amber-400 tracking-wider mt-1 uppercase">SMK IBU KARTINI SEMARANG</p>
                </div>
            </div>

            <!-- System Live Clock -->
            <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl border border-white/15 text-center min-w-[120px]">
                <p class="text-[10px] uppercase font-bold tracking-widest text-slate-300">Waktu Sistem</p>
                <p id="liveClock" class="text-lg font-extrabold tracking-wider text-white font-mono leading-tight">00.00.00</p>
            </div>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 flex-1 w-full">
        
        <!-- Floating Toast Alert -->
        <div id="toast" class="hidden fixed bottom-6 right-6 bg-navy-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 z-50 border border-slate-700 transition-all duration-300">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
            <span id="toastMessage" class="text-sm font-medium">Notifikasi</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- LEFT PANEL: Registration Form -->
            <div class="lg:col-span-5">
                <div class="bg-white rounded-2xl p-6 sm:p-7 form-shadow left-accent-line relative overflow-hidden">
                    
                    <!-- Header Title -->
                    <div class="flex items-center space-x-3 mb-6">
                        <i class="fa-solid fa-box-archive text-brand-blue text-xl"></i>
                        <h2 class="text-lg font-bold text-navy-900 tracking-tight">Registrasi Peminjaman Barang</h2>
                    </div>

                    <form id="loanForm" class="space-y-4">
                        
                        <!-- Nama Lengkap Siswa -->
                        <div>
                            <label for="borrowerName" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">NAMA LENGKAP PEMINJAM</label>
                            <input type="text" id="borrowerName" required placeholder="Contoh: Naufal Rafif" 
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-blue focus:border-brand-blue focus:bg-white text-sm font-medium text-slate-700 transition-all outline-none">
                        </div>

                        <!-- Kelas / Divisi (Ketik / Scan QR) -->
                        <div>
                            <label for="borrowerClass" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">KELAS / DIVISI (KETIK / SCAN QR)</label>
                            <div class="flex gap-2">
                                <input type="text" id="borrowerClass" required placeholder="Contoh: XII RPL 1" 
                                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-blue focus:border-brand-blue focus:bg-white text-sm font-medium text-slate-700 transition-all outline-none">
                                <button type="button" onclick="window.simulateQRScan()" title="Scan QR Code Kelas" class="bg-sky-100 hover:bg-sky-200 text-brand-blue px-3.5 py-3 rounded-xl transition-colors border border-sky-200 flex items-center justify-center">
                                    <i class="fa-solid fa-qrcode text-lg"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Nama Barang / Peralatan -->
                        <div>
                            <label for="itemName" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">NAMA BARANG / PERALATAN</label>
                            <input type="text" id="itemName" required placeholder="Contoh: Proyektor Epson EB-E500" 
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-blue focus:border-brand-blue focus:bg-white text-sm font-medium text-slate-700 transition-all outline-none">
                        </div>

                        <!-- Jumlah -->
                        <div>
                            <label for="itemQty" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">JUMLAH</label>
                            <input type="number" id="itemQty" min="1" value="1" required 
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-blue focus:border-brand-blue focus:bg-white text-sm font-medium text-slate-700 transition-all outline-none">
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-2">
                            <button type="submit" id="submitBtn" class="w-full bg-navy-900 hover:bg-navy-800 active:bg-navy-950 text-white font-bold py-3.5 rounded-xl uppercase tracking-wider text-sm transition-all shadow-md hover:shadow-lg flex items-center justify-center space-x-2">
                                <span>PROSES PINJAM</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- RIGHT PANEL: Tabs, Search & Item List -->
            <div class="lg:col-span-7">
                <div class="bg-white rounded-2xl p-6 custom-shadow border border-slate-100">
                    
                    <!-- Tabs Navigation -->
                    <div class="flex border-b border-slate-200 mb-5">
                        <button id="tabDipinjam" onclick="window.switchTab('dipinjam')" class="pb-3 px-2 font-bold text-sm text-brand-blue border-b-2 border-brand-blue transition-all mr-6">
                            Sedang Dipinjam
                        </button>
                        <button id="tabKembali" onclick="window.switchTab('dikembalikan')" class="pb-3 px-2 font-semibold text-sm text-slate-400 hover:text-slate-600 transition-all">
                            Sudah Kembali
                        </button>
                    </div>

                    <!-- Search & Action Toolbar -->
                    <div class="flex flex-col sm:flex-row gap-3 justify-between items-center mb-5">
                        <div class="relative w-full sm:w-auto flex-1">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-magnifying-glass text-sm"></i>
                            </div>
                            <input type="text" id="searchInput" placeholder="Cari nama peminjam, kelas, atau barang..." 
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-brand-blue focus:bg-white outline-none transition-all">
                        </div>

                        <button onclick="window.exportToCSV()" class="w-full sm:w-auto bg-emerald-100 hover:bg-emerald-200 text-emerald-700 border border-emerald-200 font-bold px-4 py-2.5 rounded-xl text-xs tracking-wider uppercase transition-colors flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-download"></i>
                            <span>EKSPOR LAPORAN</span>
                        </button>
                    </div>

                    <!-- Section Label -->
                    <div class="mb-4">
                        <h3 id="sectionTitle" class="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                            DAFTAR AKTIF (SEDANG DIPINJAM)
                        </h3>
                    </div>

                    <!-- List Cards Container -->
                    <div id="itemsContainer" class="space-y-4 min-h-[220px]">
                        <!-- Dynamic Card Items Rendered Here -->
                    </div>

                    <!-- Empty State View -->
                    <div id="emptyState" class="hidden py-12 text-center">
                        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-slate-100 text-slate-400 mb-3">
                            <i class="fa-solid fa-inbox text-xl"></i>
                        </div>
                        <p class="text-sm font-semibold text-slate-500">Tidak ada data peminjaman ditemukan</p>
                    </div>

                    <!-- Bottom Footer Stats & Reset -->
                    <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-xs font-bold text-slate-600">
                        <div>
                            Total Item: <span id="totalItemCount" class="text-navy-900 font-extrabold text-sm ml-1">0</span>
                        </div>
                        <button onclick="window.resetAllData()" class="text-rose-500 hover:text-rose-700 transition-colors font-semibold">
                            Reset Seluruh Data
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Modal Konfirmasi Hapus / Reset -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100">
            <h3 class="font-bold text-slate-800 text-base mb-2">Konfirmasi Tindakan</h3>
            <p id="confirmModalMessage" class="text-xs text-slate-500 mb-5">Apakah Anda yakin ingin melakukan tindakan ini?</p>
            <div class="flex justify-end space-x-2">
                <button onclick="window.closeConfirmModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition-colors">Batal</button>
                <button id="confirmModalBtn" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-semibold transition-colors">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic (Firebase Connected) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup & Initialization with User's Custom Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAFQCvYAH7W-VNIh0rHZljOn7nro873E1w",
            authDomain: "pinjaman-barang-8deac.firebaseapp.com",
            projectId: "pinjaman-barang-8deac",
            storageBucket: "pinjaman-barang-8deac.firebasestorage.app",
            messagingSenderId: "513311087193",
            appId: "1:513311087193:web:4933edde1d83f9a362af48",
            measurementId: "G-3PTJYXTPXM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Management
        let itemsData = [];
        let currentTab = 'dipinjam';
        let searchQuery = '';
        let pendingAction = null;

        // Collection Reference
        const LOANS_COLLECTION = 'loans';

        // Initialize App & Authentication
        async function initApp() {
            startClock();
            try {
                await signInAnonymously(auth);
            } catch (err) {
                console.warn("Auth error, continuing with public rules fallback:", err);
            }
            subscribeToFirestore();
        }

        // Real-time Firestore Listener
        function subscribeToFirestore() {
            const colRef = collection(db, LOANS_COLLECTION);
            onSnapshot(colRef, (snapshot) => {
                itemsData = snapshot.docs.map(docSnap => ({
                    id: docSnap.id,
                    ...docSnap.data()
                }));
                // Sort by date created descending
                itemsData.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderUI();
            }, (error) => {
                console.error("Firestore subscription error:", error);
                showToast("Gagal terhubung ke database cloud", "error");
            });
        }

        // Realtime Clock Function
        function startClock() {
            const clockEl = document.getElementById('liveClock');
            function update() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                if (clockEl) {
                    clockEl.textContent = `${hours}.${minutes}.${seconds}`;
                }
            }
            update();
            setInterval(update, 1000);
        }

        // UI Render Function
        function renderUI() {
            const container = document.getElementById('itemsContainer');
            const emptyState = document.getElementById('emptyState');
            const sectionTitle = document.getElementById('sectionTitle');
            const totalCountEl = document.getElementById('totalItemCount');

            // Filter by tab status and search query
            const filtered = itemsData.filter(item => {
                const matchesTab = item.status === currentTab;
                const matchesSearch = searchQuery === '' || 
                    item.borrowerName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.borrowerClass.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.itemName.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesTab && matchesSearch;
            });

            totalCountEl.textContent = filtered.length;

            if (currentTab === 'dipinjam') {
                sectionTitle.textContent = "DAFTAR AKTIF (SEDANG DIPINJAM)";
            } else {
                sectionTitle.textContent = "HISTORI PENGEMBALIAN (SUDAH KEMBALI)";
            }

            container.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                const isDipinjam = item.status === 'dipinjam';
                const accentClass = isDipinjam ? 'left-orange-accent' : 'left-green-accent';

                card.className = `bg-slate-50 border border-slate-200/80 rounded-2xl p-4 sm:p-5 transition-all hover:shadow-md ${accentClass} relative flex flex-col justify-between gap-4`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center space-x-2 mb-1.5 flex-wrap gap-y-1">
                                <span class="bg-blue-100 text-brand-blue font-bold text-[10px] px-2.5 py-0.5 rounded-md tracking-wider uppercase">${escapeHtml(item.borrowerClass)}</span>
                                <span class="${isDipinjam ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'} font-bold text-[10px] px-2.5 py-0.5 rounded-full flex items-center gap-1.5 uppercase">
                                    <span class="w-1.5 h-1.5 rounded-full ${isDipinjam ? 'bg-amber-500' : 'bg-emerald-500'}"></span>
                                    ${isDipinjam ? 'DIPINJAM' : 'DIKEMBALIKAN'}
                                </span>
                            </div>
                            <h4 class="text-base font-extrabold text-navy-900 tracking-tight uppercase">${escapeHtml(item.borrowerName)}</h4>
                            <div class="flex items-center space-x-2 text-xs font-semibold text-slate-500 mt-1">
                                <span class="text-brand-blue font-bold">${escapeHtml(item.itemName)}</span>
                                <span>•</span>
                                <span class="bg-slate-200/70 px-2 py-0.5 rounded text-[11px]">${item.itemQty} Unit</span>
                            </div>
                        </div>
                        <button onclick="window.confirmDelete('${item.id}')" title="Hapus Data" class="text-slate-300 hover:text-rose-500 transition-colors p-1">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>

                    <div class="pt-3 border-t border-slate-200/60 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-slate-400 text-[11px] font-medium">
                        <div>
                            <span>PINJAM: <strong class="text-slate-600">${item.loanDate}</strong></span>
                            ${item.returnDate ? `<span class="ml-2">| KEMBALI: <strong class="text-slate-600">${item.returnDate}</strong></span>` : ''}
                        </div>
                        ${isDipinjam ? `
                            <button onclick="window.returnItem('${item.id}')" class="w-full sm:w-auto bg-brand-blue hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-xs tracking-wider uppercase transition-all shadow-sm hover:shadow flex items-center justify-center space-x-1.5">
                                <i class="fa-solid fa-box-open text-xs"></i>
                                <span>KEMBALIKAN BARANG</span>
                            </button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Global Event Handlers Explicitly Bounded to Window
        window.switchTab = function(tab) {
            currentTab = tab;
            const tabDipinjam = document.getElementById('tabDipinjam');
            const tabKembali = document.getElementById('tabKembali');

            if (tab === 'dipinjam') {
                tabDipinjam.className = "pb-3 px-2 font-bold text-sm text-brand-blue border-b-2 border-brand-blue transition-all mr-6";
                tabKembali.className = "pb-3 px-2 font-semibold text-sm text-slate-400 hover:text-slate-600 transition-all";
            } else {
                tabKembali.className = "pb-3 px-2 font-bold text-sm text-brand-blue border-b-2 border-brand-blue transition-all";
                tabDipinjam.className = "pb-3 px-2 font-semibold text-sm text-slate-400 hover:text-slate-600 transition-all mr-6";
            }
            renderUI();
        };

        window.simulateQRScan = function() {
            const classes = ['X RPL 1', 'XI TKJ 2', 'XII RPL 1', 'X AKL 3', 'XI OTKP 1'];
            const randomClass = classes[Math.floor(Math.random() * classes.length)];
            document.getElementById('borrowerClass').value = randomClass;
            showToast(`QR Code Terdeteksi: Kelas ${randomClass}`);
        };

        window.returnItem = async function(id) {
            try {
                const now = new Date();
                const returnDateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + `, ${String(now.getHours()).padStart(2,'0')}.${String(now.getMinutes()).padStart(2,'0')}`;
                
                const itemRef = doc(db, LOANS_COLLECTION, id);
                await updateDoc(itemRef, {
                    status: 'dikembalikan',
                    returnDate: returnDateStr
                });
                showToast("Barang berhasil dikembalikan!");
            } catch (err) {
                console.error("Error returning item:", err);
                showToast("Gagal memperbarui status", "error");
            }
        };

        window.confirmDelete = function(id) {
            document.getElementById('confirmModalMessage').textContent = "Apakah Anda yakin ingin menghapus data peminjaman ini secara permanen?";
            const confirmBtn = document.getElementById('confirmModalBtn');
            confirmBtn.onclick = async () => {
                try {
                    await deleteDoc(doc(db, LOANS_COLLECTION, id));
                    window.closeConfirmModal();
                    showToast("Data peminjaman berhasil dihapus!");
                } catch (err) {
                    console.error("Error deleting item:", err);
                    showToast("Gagal menghapus data", "error");
                }
            };
            document.getElementById('confirmModal').classList.remove('hidden');
        };

        window.resetAllData = function() {
            if (itemsData.length === 0) {
                showToast("Tidak ada data untuk dihapus", "error");
                return;
            }
            document.getElementById('confirmModalMessage').textContent = "Apakah Anda yakin ingin MENGHAPUS SELURUH DATA peminjaman dari database?";
            const confirmBtn = document.getElementById('confirmModalBtn');
            confirmBtn.onclick = async () => {
                try {
                    const snapshot = await getDocs(collection(db, LOANS_COLLECTION));
                    const deletePromises = snapshot.docs.map(docSnap => deleteDoc(doc(db, LOANS_COLLECTION, docSnap.id)));
                    await Promise.all(deletePromises);
                    window.closeConfirmModal();
                    showToast("Seluruh data telah dibersihkan!");
                } catch (err) {
                    console.error("Error resetting data:", err);
                    showToast("Gagal mereset data", "error");
                }
            };
            document.getElementById('confirmModal').classList.remove('hidden');
        };

        window.closeConfirmModal = function() {
            document.getElementById('confirmModal').classList.add('hidden');
        };

        window.exportToCSV = function() {
            if (itemsData.length === 0) {
                showToast("Tidak ada data untuk diekspor", "error");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "No,Nama Peminjam,Kelas,Nama Barang,Jumlah,Status,Tanggal Pinjam,Tanggal Kembali\n";

            itemsData.forEach((item, index) => {
                const row = [
                    index + 1,
                    `"${item.borrowerName}"`,
                    `"${item.borrowerClass}"`,
                    `"${item.itemName}"`,
                    item.itemQty,
                    `"${item.status.toUpperCase()}"`,
                    `"${item.loanDate}"`,
                    `"${item.returnDate || '-'}"`
                ].join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `laporan_peminjaman_barang_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Laporan CSV berhasil diunduh!");
        };

        // Form Submit Handler
        document.getElementById('loanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const borrowerName = document.getElementById('borrowerName').value.trim();
            const borrowerClass = document.getElementById('borrowerClass').value.trim();
            const itemName = document.getElementById('itemName').value.trim();
            const itemQty = parseInt(document.getElementById('itemQty').value) || 1;

            if (!borrowerName || !borrowerClass || !itemName) {
                showToast("Mohon lengkapi seluruh formulir", "error");
                return;
            }

            const now = new Date();
            const loanDateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + `, ${String(now.getHours()).padStart(2,'0')}.${String(now.getMinutes()).padStart(2,'0')}`;

            const newItem = {
                borrowerName,
                borrowerClass,
                itemName,
                itemQty,
                status: 'dipinjam',
                loanDate: loanDateStr,
                returnDate: null,
                createdAt: Date.now()
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>MENYIMPAN...</span>`;

            try {
                await addDoc(collection(db, LOANS_COLLECTION), newItem);
                document.getElementById('loanForm').reset();
                showToast("Peminjaman berhasil dicatat!");
            } catch (err) {
                console.error("Error adding loan:", err);
                showToast("Gagal menyimpan data ke database", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>PROSES PINJAM</span>`;
            }
        });

        // Search Input Listener
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderUI();
        });

        // Toast Notification Helper
        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            if (type === 'error') {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            }

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Helper Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // Initialize App on DOM Content Loaded
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
